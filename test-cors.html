<!DOCTYPE html>
<html>
<head>
    <title>CORS Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            background: #4CAF50;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 0;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            white-space: pre-wrap;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>🔧 CORS & Login Test</h1>
    <p>This will test if the frontend can connect to the backend.</p>
    
    <button onclick="testCORS()">1. Test CORS Connection</button>
    <button onclick="testLogin()">2. Test Admin Login</button>
    
    <div id="result"></div>

    <script>
        async function testCORS() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="result">Testing CORS...</div>';
            
            try {
                const response = await fetch('http://localhost:5000/', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <div class="result success">
                        ✅ CORS is working!<br><br>
                        Response: ${JSON.stringify(data, null, 2)}
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        ❌ CORS Error!<br><br>
                        ${error.message}<br><br>
                        This means the backend is not allowing requests from this origin.
                    </div>
                `;
            }
        }

        async function testLogin() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="result">Testing login...</div>';
            
            try {
                const response = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'admin@fashionhub.com',
                        password: 'admin123456'
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="result success">
                            ✅ Login successful!<br><br>
                            Name: ${data.data.name}<br>
                            Email: ${data.data.email}<br>
                            Role: ${data.data.role}<br>
                            Token: ${data.data.token.substring(0, 50)}...<br><br>
                            <strong>Your admin panel should work now!</strong>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="result error">
                            ❌ Login failed!<br><br>
                            ${JSON.stringify(data, null, 2)}
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        ❌ Connection Error!<br><br>
                        ${error.message}<br><br>
                        Possible causes:<br>
                        1. Backend not running (start with: cd backend && npm start)<br>
                        2. CORS not configured for port 3000<br>
                        3. Network/firewall issue
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
